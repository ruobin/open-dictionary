server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP: scripts bundled same-origin only (no inline scripts); Auth0 reachable
    # for token renewals/iframe auth; MW audio from its media CDN; social-login
    # avatars (Google/Facebook) + Auth0 default avatar from their CDNs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com https://graph.facebook.com https://s.gravatar.com; media-src 'self' https://media.merriam-webster.com; font-src 'self' data:; connect-src 'self' https://dev-oz1bs6okox5c8xd0.us.auth0.com; frame-src 'self' https://dev-oz1bs6okox5c8xd0.us.auth0.com; object-src 'none'; base-uri 'self'; form-action 'self' https://dev-oz1bs6okox5c8xd0.us.auth0.com; frame-ancestors 'none'" always;

    # Vite emits content-hashed filenames — cache immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + health -> reverse proxy to the Express API container.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://api:3001/health;
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

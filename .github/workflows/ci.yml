name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Needs no database, network or secrets: vite.config.ts supplies
      # placeholder AUTH0_* values for test runs. Includes extension/src tests,
      # which import only packages the root install provides.
      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Smoke-start server
        run: |
          AUTH0_DOMAIN=example.auth0.com \
          AUTH0_AUDIENCE=https://example \
          AUTH0_MGMT_CLIENT_ID=cid \
          AUTH0_MGMT_CLIENT_SECRET=secret \
          PORT=3001 npx tsx server/index.ts &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:3001/health
          kill $SERVER_PID

      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

  # The browser extension is its own npm package with its own tsconfig, so the
  # root typecheck and build above do not cover it. (Its unit tests already run
  # in the job above: the root `npm test` picks them up.)
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      # The root install is needed too: extension/tsconfig.json includes
      # ../shared, whose test files import vitest from the root node_modules.
      - name: Install (root)
        run: npm ci

      - name: Install (extension)
        run: npm --prefix extension ci

      - name: Typecheck extension
        run: npx tsc --noEmit -p extension/tsconfig.json

      - name: Build extension
        run: npm run ext:build
